[package]
name = "resync"
version = "0.15.3"
edition = "2024"
rust-version = "1.98.0"
authors = ["Ivan Chetchasov <vi.is.chapmann@gmail.com>"]
license = "MIT OR Apache-2.0"
description = "A LEGO-like synchronization primitives library for Rust"
repository = "https://github.com/vi-is-ramen/resync"
readme = "README.md"
homepage = "https://github.com/vi-is-ramen/resync/"
categories = ["concurrency", "no-std", "os", "no-std::no-alloc", "embedded"]
keywords = ["mutex", "synchronization", "no_std", "lock", "thread"]

[dependencies]
libc = { version = "0.2", optional = true }
# reta = "=0.1.1"
# lock_api = "0.4"
windows-sys = { version = "0.61", optional = true, features = [
    "Win32_System_Threading",
    "Win32_Foundation"
] }

[build-dependencies]
rustversion = "1"

[dev-dependencies]
criterion = "0.8"

[features]
default = [ "std" ]
std = [ "dep:libc", "dep:windows-sys" ]
fake = []
dev = []
__lint = [ "std", "fake", "dev" ]

[lints.rust]
unexpected_cfgs = { level = 'allow', check-cfg = ['cfg(nightly)', 'cfg(stable)',
    'cfg(beta)', 'cfg(dev)', 'cfg(docsrs)', 'cfg(std)', 'cfg(no_std)'] }
missing_docs = 'deny'
missing_debug_implementations = 'deny'

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[[bench]]
name = "mutex"
harness = false
required-features = ["std"]

[[bench]]
name = "sharex"
harness = false
required-features = ["std"]

[[bench]]
name = "once_lazy"
harness = false
required-features = ["std"]

[[bench]]
name = "flow"
harness = false
required-features = ["std", "dev"]
