name: Release

on:
  push:
    tags:
      - "v*"

# Grant write access to contents so the cleanup job can delete the tag on failure
permissions:
  contents: write

jobs:
  test:
    name: Test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable, beta, nightly]
        features: ["", "--no-default-features", "--all-features"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - name: Run tests
        shell: bash
        run: |
          # Test all subsets of features
          if [ -z "${{ matrix.features }}" ]; then
            cargo test
          else
            cargo test ${{ matrix.features }}
          fi

  publish:
    name: Publish to crates.io
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: cargo publish

  release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for cocogitto to read commit history

      - name: Generate Changelog
        id: changelog
        uses: cocogitto/cocogitto-action@v4
        with:
          command: changelog
          # Generate changelog specifically for the tag that triggered the workflow
          args: --at ${{ github.ref_name }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.changelog.outputs.stdout }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  cleanup:
    name: Cleanup on Failure
    needs: [test, publish, release]
    # Run this job regardless of success/failure, but only execute the step if a dependency failed
    if: always() && (needs.test.result == 'failure' || needs.publish.result == 'failure' || needs.release.result == 'failure')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Delete tag on failure
        # This prevents "tag already exists" errors when you fix the bug and retry the release
        run: git push --delete origin ${{ github.ref_name }} || true
