name: Question / Help
description: Ask a question about how to use Resync or how to implement a custom trait
title: "question: "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        If you have a general question about Rust concurrency, you might get faster answers on the [Rust Users Forum](https://users.rust-lang.org/).
        If your question is specifically about Resync's API, please fill out the form below.
  - type: textarea
    id: question
    attributes:
      label: What do you need help with?
      description: Describe what you are trying to achieve and where you are stuck.
    validations:
      required: true
  - type: textarea
    id: code
    attributes:
      label: Code snippet (if applicable)
      description: Provide a code snippet showing what you have tried so far.
