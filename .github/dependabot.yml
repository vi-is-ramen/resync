version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
    groups:
      all-dependencies:
        patterns:
          - "*"
  - package-ecosystem: "cargo"
    directory: "/"
    open-pull-requests-limit: 10
    schedule:
      interval: daily
    groups:
      all-dependencies:
        patterns:
          - "*"
